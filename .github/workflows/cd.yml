name: cd

# main: test -> build -> push (тег = SHA) -> deploy образа -> smoke.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Весь run в одной группе, без отмены текущего: пока идёт деплой, GitHub держит
# в очереди только самый свежий run, промежуточные отменяются. Группа на уровне
# workflow, а не job: иначе более старый run мог бы дойти до deploy позже нового.
concurrency:
  group: cd-dev
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # sub=repo:<org>@<org_id>/<repo>@<repo_id>:ref:refs/heads/main
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Сразу получить токен SA: ошибки WIF/IAM падают здесь, а не позже в docker push.
          token_format: access_token
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
      - run: make build
      - run: make push
      - run: make deploy
      - run: make smoke
      - name: Summary
        if: always()
        run: |
          {
            echo "### DEV deploy: ${{ job.status }}"
            echo "- SHA: \`${IMAGE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
