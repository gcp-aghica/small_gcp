name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make lint
      - run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make test

  # PR: проверяем, что образ собирается. Без push и без какого-либо доступа к GCP.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build REGISTRY=local IMAGE_TAG=${{ github.event.pull_request.head.sha }}

  # main: собираем образ один раз, тег = полный SHA коммита.
  build-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC-токен для WIF, sub=repo:<owner>/<repo>:ref:refs/heads/main
    steps:
      - uses: actions/checkout@v4
      - name: Debug OIDC claims (temporary)
        run: |
            tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=debug" | jq -r .value)
            p=$(echo "$tok" | cut -d. -f2 | tr '_-' '/+')
            while [ $(( ${#p} % 4 )) -ne 0 ]; do p="$p="; done
            echo "$p" | base64 -d | jq '{sub, repository, ref, event_name, environment, repository_owner}'
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Configure docker for Artifact Registry
        run: gcloud auth configure-docker "${REGISTRY%%/*}" --quiet
        env:
          REGISTRY: ${{ vars.REGISTRY }}
      - run: make build REGISTRY=${{ vars.REGISTRY }} IMAGE_TAG=${{ github.sha }}
      - run: make push REGISTRY=${{ vars.REGISTRY }} IMAGE_TAG=${{ github.sha }}

  deploy-dev:
    needs: build-main
    permissions:
      contents: read
      id-token: write # reusable workflow получает не больше прав, чем выдал вызывающий job
    uses: ./.github/workflows/cd.yml
    with:
      sha: ${{ github.sha }}
