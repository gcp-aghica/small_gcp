name: ci

# PR: lint, test, сборка образов без push. Доступа к GCP нет: id-token не выдаётся,
# а sub ...:pull_request не привязан к CI/CD SA.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make lint
      - run: make format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make install
      - run: make test

  build-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make build REGISTRY=local IMAGE_TAG=${{ github.event.pull_request.head.sha }}
